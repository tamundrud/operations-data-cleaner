name: Feature request
description: Suggest a product improvement
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What operational problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed outcome or workflow
  - type: textarea
    id: workarounds
    attributes:
      label: Existing workarounds and constraints
