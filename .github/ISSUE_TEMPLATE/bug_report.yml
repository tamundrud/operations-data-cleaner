name: Bug report
description: Report a reproducible defect using synthetic data only
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not upload real orders, invoices, customer information, or confidential files. Use synthetic examples. Security reports must follow SECURITY.md."
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce with synthetic data
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser, OS, and app version (if applicable)
