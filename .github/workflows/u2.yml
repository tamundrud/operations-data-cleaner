name: CSV conversion verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    name: browser (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csv-browser-evidence-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
            docs/reviews/issue-14/screenshots/
          retention-days: 14

  verify:
    name: verify
    needs: browser
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser job to pass
        run: test "${{ needs.browser.result }}" = success
